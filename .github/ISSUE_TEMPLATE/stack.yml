name: New stack module / Nouveau module de techno
description: Ask for or propose a module (Laravel, Astro, Expo, Django…) / Demander ou proposer un module
labels: [stack-module]
body:
  - type: input
    id: stack
    attributes:
      label: Stack / Techno
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Typecheck, lint, test, audit commands / Commandes de typage, lint, tests, audit
  - type: textarea
    id: rules
    attributes:
      label: Stack-specific rules / Règles propres à cette techno
