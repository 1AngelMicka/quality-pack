name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  referential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate referential and check generated docs are up to date
        run: |
          python tools/referential.py docs
          git diff --exit-code docs/
      - name: Score the example audits
        run: python plugins/core/scripts/score.py examples/audit-2.json --previous examples/audit-1.json
