name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pyyaml
      - name: Rebuild generated files and check they are committed
        run: |
          python tools/build.py
          git diff --exit-code
      - name: Install Playwright, axe-core and Chromium in the pack cache
        run: node plugins/core/scripts/qp.mjs browser-setup
      - name: Tests
        run: node --test tests/*.test.mjs
