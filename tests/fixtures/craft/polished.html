<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polished</title>
<style>
  body { font-family: Georgia, serif; color: #1c1a17; background: #fbfaf7; margin: 0; padding: 24px; }
  ::selection { background: #1f4d3a; color: #fff; }
  h1 { font-size: 48px; line-height: 1.1; max-width: 420px; text-wrap: balance; }
  .eyebrow { text-transform: uppercase; font-size: 12px; letter-spacing: 0.08em; }
  .card { border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(28,26,23,0.06), 0 8px 24px rgba(28,26,23,0.08); max-width: 480px; }
  .card .inner { border-radius: 4px; background: #efece4; padding: 12px; }
  button, a.btn { display: inline-block; background: #1f4d3a; color: #fff; border: 0; padding: 12px 20px; font: inherit; font-size: 16px; text-decoration: none; transition: background-color 150ms ease-out; }
  button:hover, a.btn:hover { background: #2a6a50; }
  :focus-visible { outline: 2px solid #1f4d3a; outline-offset: 2px; }
  /* A focus ring that eases in: at the first instant it is still 0 px wide. */
  .eased { outline: 0 solid #1f4d3a; transition: outline-width 0.25s ease-out; }
  .eased:focus-visible { outline-width: 3px; }
  input { font: inherit; font-size: 16px; padding: 8px; }
  td { padding: 4px 12px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  img { width: 100px; height: 100px; }
</style>
</head>
<body>
  <p class="eyebrow">New release</p>
  <h1>Ship the next idea before the week ends</h1>
  <p>It’s “simple” — you’ll see.</p>
  <div class="card"><div class="inner">Nested box with a smaller radius</div></div>
  <p><button>Start a project</button> <a class="btn" href="#x">Read the docs</a></p>
  <p><label>Email <input type="email" name="email"></label></p>
  <table>
    <tr><th>Plan</th><th>Price</th></tr>
    <tr><td>Solo</td><td class="num">9.00</td></tr>
    <tr><td>Team</td><td class="num">111.00</td></tr>
    <tr><td>Org</td><td class="num">1,499.00</td></tr>
  </table>
  <p><a class="eased" href="#top">Back to the top</a></p>
  <img alt="Mark" width="100" height="100" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Crect width='10' height='10' fill='%231f4d3a'/%3E%3C/svg%3E">
</body>
</html>
