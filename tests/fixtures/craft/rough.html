<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rough</title>
<style>
  body { font-family: Arial, sans-serif; color: #000; background: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 48px; line-height: 1.6; max-width: 420px; }
  .eyebrow { text-transform: uppercase; font-size: 12px; }
  .card { border-radius: 16px; padding: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); max-width: 480px; }
  .card .inner { border-radius: 16px; background: #eee; padding: 12px; }
  button { background: #2563eb; color: #fff; border: 0; padding: 12px 20px; font-size: 16px; outline: none; }
  a.btn { display: inline-block; background: #111; color: #fff; padding: 12px 20px; text-decoration: none; outline: none; transition: all 0.8s; }
  input { font-size: 13px; padding: 8px; outline: none; }
  td { padding: 4px 12px; }
  img.stretch { width: 300px; height: 80px; }
  b { font-weight: 800; } i { font-weight: 300; font-style: normal; } u { font-weight: 500; text-decoration: none; } s { font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <p class="eyebrow">New release</p>
  <h1>The fastest way to ship your next big idea to</h1>
  <p>It's "simple"... really - you'll see.  Don't wait.</p>
  <p><b>Bold</b> <i>light</i> <u>medium</u> <s>semi</s> text.</p>
  <div class="card"><div class="inner">Nested box with the same radius</div></div>
  <p><button>Get Started Now</button> <a class="btn" href="#x">Learn more today</a> <button>Read the docs</button></p>
  <p><label>Email <input type="email" name="email"></label></p>
  <table>
    <tr><th>Plan</th><th>Price</th></tr>
    <tr><td>Solo</td><td>9.00</td></tr>
    <tr><td>Team</td><td>111.00</td></tr>
    <tr><td>Org</td><td>1,499.00</td></tr>
  </table>
  <img class="stretch" alt="Chart" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAFUlEQVR42mNkYPhfz0AEYBxVSF+FAP5FDvcfRYWgAAAAAElFTkSuQmCC">
</body>
</html>
