<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink and paper</title>
<style>
  /* Declared, but the file is not there: the tile would show a fallback font to the client. */
  @font-face { font-family: "Ink Display"; src: url("fonts/ink-display.woff2") format("woff2"); font-weight: 700; }
  body { margin: 0; padding: 32px; background: #f4efe6; color: #1d1a16; font: 17px/1.6 "Paper Text", system-ui, sans-serif; }
  h1 { font: 700 56px/1.05 "Ink Display", serif; margin: 0 0 24px; }
  .swatch { display: inline-block; width: 64px; height: 64px; margin-right: 8px; }
</style>
</head>
<body>
  <h1>Ink and paper</h1>
  <p>Body text, set in the text face of the tile.</p>
  <span class="swatch" style="background:#1d1a16"></span><span class="swatch" style="background:#b8432f"></span><span class="swatch" style="background:#f4efe6;border:1px solid #ccc"></span>
</body>
</html>
