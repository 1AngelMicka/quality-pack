# Automatic checks referenced by criteria (check.tool).
# "core" checks are generic and shipped by the core plugin.
# "stack" checks are mapped to real commands by each stack module (stack.yaml).
# When no module provides a stack check, the auditor falls back to inspection and says so.

checks:
  placeholder_scan: {provider: core, fr: "Recherche de textes de remplissage et faux contenus", en: "Search for filler text and fake content"}
  slop_wording_scan: {provider: core, fr: "Recherche des formules creuses (liste noire FR/EN)", en: "Search for hollow wording (FR/EN blacklist)"}
  debug_leftovers_scan: {provider: core, fr: "Recherche de logs de débogage, code commenté, fichiers temporaires", en: "Search for debug logs, commented-out code, temporary files"}
  secrets_scan: {provider: core, fr: "gitleaks sur le dépôt et l'historique, recherche de clés dans le build", en: "gitleaks on repo and history, key search in the build"}
  headers_check: {provider: core, fr: "Lecture des headers HTTP de sécurité, compression et cache", en: "Read HTTP security, compression and caching headers"}
  cookie_scan: {provider: core, fr: "Cookies et requêtes tierces avant consentement (Playwright)", en: "Cookies and third-party requests before consent (Playwright)"}
  seo_scan: {provider: core, fr: "Exploration : titres, descriptions, canoniques, OpenGraph, robots, sitemap", en: "Crawl: titles, descriptions, canonicals, OpenGraph, robots, sitemap"}
  axe: {provider: core, fr: "axe-core via Playwright sur les pages principales", en: "axe-core via Playwright on main pages"}
  contrast_check: {provider: core, fr: "Contrastes des tokens et des pages rendues", en: "Contrast of tokens and rendered pages"}
  flow_run: {provider: core, fr: "Tâches clés jouées pas à pas sur téléphone et ordinateur (Playwright) : capture, axe-core et mesures d'effort à chaque étape", en: "Key tasks played step by step on phone and desktop (Playwright): screenshot, axe-core and effort measures at every step"}
  spacing_audit: {provider: core, fr: "Audit de l'espacement et de l'alignement du rendu (qp deslop) : proximité, écarts entre frères, bords, boîtes, contrôles, débordements, à 375, 768, 1440 et 1920 px", en: "Spacing and alignment audit of the rendered page (qp deslop): proximity, sibling gaps, edges, boxes, controls, overflow, at 375, 768, 1440 and 1920 px"}
  generic_look_scan: {provider: core, fr: "Mesure du rendu dans le navigateur : signaux de rendu générique pondérés, tailles et familles de police, rayons, longueur et interlignage des lignes, petites cibles", en: "Rendered page measured in the browser: weighted generic-look signals, font sizes and families, radii, line length and height, small targets"}
  craft_scan: {provider: core, fr: "Finitions du rendu mesurées dans le navigateur (qp craft) : typographie, focus et survol, transitions, images, icônes, icône du site, image de partage, page 404", en: "Finish of the rendered page measured in the browser (qp craft): typography, focus and hover, transitions, images, icons, site icon, share image, 404 page"}
  desktop_release_scan: {provider: core, fr: "Application de bureau lue dans le projet (qp desktop check) : politique de sécurité du contenu, permissions, isolation, mises à jour, signature", en: "Desktop app read from the project (qp desktop check): content security policy, permissions, isolation, updater, signing"}
  perf_run: {provider: core, fr: "Chargement mesuré sur un téléphone ralenti (qp perf) : plus grand affichage, saut de mise en page, temps de blocage, poids de la page et des scripts, requêtes", en: "Loading measured on a throttled phone (qp perf): largest paint, layout shift, blocking time, weight of the page and of scripts, requests"}
  webhook_probe: {provider: core, fr: "Webhooks joués (qp webhooks) : un événement non signé ou mal signé doit être refusé. Local ou préproduction seulement", en: "Webhooks played (qp webhooks): an unsigned or wrongly signed event must be refused. Local or staging only"}
  facts_scan: {provider: core, fr: "Chiffres, citations, noms de clients et badges affichés sur les pages publiques (qp facts), chacun relié à .quality/facts.json", en: "Figures, quotes, customer names and badges shown on public pages (qp facts), each traced to .quality/facts.json"}
  seo_pages: {provider: core, fr: "Pages publiques prêtes pour la recherche (qp seo) : sitemap trouvé, déclaré et sans adresse cassée, titre et description remplis et uniques, un seul h1, mots-clés visés portés par leur page, Search Console", en: "Public pages ready for search (qp seo): sitemap found, declared and without a broken address, title and description filled and unique, one h1, target keywords carried by their page, Search Console"}
  stress_run: {provider: core, fr: "Passes de finition (qp stress) : l'écran avec un réseau lent, un serveur en panne, des textes trois fois plus longs, 320 px de large, le thème sombre, le clavier seul et sans scripts", en: "Finishing passes (qp stress): the screen with a slow network, a failing server, texts three times longer, 320 px wide, the dark scheme, the keyboard only and scripts off"}
  access_run: {provider: core, fr: "Contrôle d'accès joué pour de vrai (qp access) : chaque ressource déclarée est demandée par son propriétaire puis par les comptes qui ne doivent pas l'atteindre", en: "Access control played for real (qp access): each declared resource is requested by its owner, then by the accounts that must not reach it"}
  auth_probe: {provider: core, fr: "Connexion de l'application en marche (qp auth) : même réponse pour un compte connu et inconnu, mots de passe faux en série ralentis ou refusés. Local ou préproduction seulement", en: "Login of the running app (qp auth): same answer for known and unknown accounts, wrong passwords in a row slowed or refused. Local or staging only"}
  dast_scan: {provider: core, fr: "Scan passif de l'application avec OWASP ZAP (qp dast, Docker) : en-têtes, cookies, fuites d'information, bibliothèques vulnérables servies au navigateur", en: "Passive scan of the running app with OWASP ZAP (qp dast, Docker): headers, cookies, information leaks, vulnerable libraries served to the browser"}
  supply_scan: {provider: core, fr: "Chaîne d'approvisionnement lue dans le dépôt (qp supply) : fichier de verrouillage, délai avant installation, scripts d'installation, actions de CI épinglées, fichiers .env", en: "Supply chain read from the repository (qp supply): lockfile, release cooldown, install scripts, pinned CI actions, .env files"}
  threat_model: {provider: core, fr: "Modèle de menaces vérifié (qp threats) : points d'entrée couverts, réponse et test pour chaque cas d'abus", en: "Threat model checked (qp threats): entry points covered, a response and a test for each abuse case"}
  mobile_flow_run: {provider: core, fr: "Tâches clés de l'app installée jouées avec Maestro sur émulateur, simulateur ou appareil (qp mobile flows)", en: "Key tasks of the installed app played with Maestro on an emulator, simulator or device (qp mobile flows)"}
  mobile_release_scan: {provider: core, fr: "Blocages de publication lus dans le projet mobile (qp mobile check) : niveau d'API cible, build débogable, trafic en clair, manifeste de confidentialité, WebView, liens, page de suppression", en: "Release blockers read from the mobile project (qp mobile check): target API level, debuggable build, cleartext traffic, privacy manifest, WebView, links, deletion page"}
  viewport_screenshots: {provider: core, fr: "Captures et débordements à 360, 390, 768, 1024, 1440 et 1920 px", en: "Screenshots and overflow at 360, 390, 768, 1024, 1440 and 1920 px"}
  console_check: {provider: core, fr: "Erreurs et avertissements console (Playwright)", en: "Console errors and warnings (Playwright)"}
  email_auth_check: {provider: core, fr: "Enregistrements SPF, DKIM, DMARC", en: "SPF, DKIM, DMARC records"}
  port_scan: {provider: core, fr: "Ports ouverts vus de l'extérieur", en: "Open ports seen from outside"}
  spellcheck: {provider: core, fr: "Correcteur orthographique sur les textes et traductions", en: "Spell checker on copy and translations"}

  typecheck: {provider: stack, fr: "Vérification des types et build", en: "Type check and build"}
  lint: {provider: stack, fr: "Linter du projet", en: "Project linter"}
  test_run: {provider: stack, fr: "Suite de tests", en: "Test suite"}
  e2e: {provider: stack, fr: "Tests de bout en bout", en: "End-to-end tests"}
  e2e_cross_browser: {provider: stack, fr: "Tests de bout en bout sur Chromium, Firefox, WebKit", en: "End-to-end tests on Chromium, Firefox, WebKit"}
  deps_audit: {provider: stack, fr: "Audit de vulnérabilités des dépendances", en: "Dependency vulnerability audit"}
  license_check: {provider: stack, fr: "Licences des dépendances", en: "Dependency licences"}
  bundle_size: {provider: stack, fr: "Taille du JavaScript envoyé au client", en: "Size of JavaScript shipped to the client"}
  lighthouse: {provider: stack, fr: "Lighthouse mobile sur les pages principales", en: "Lighthouse mobile on main pages"}
  design_token_scan: {provider: stack, fr: "Valeurs en dur au lieu des tokens", en: "Hard-coded values instead of tokens"}
  load_test: {provider: stack, fr: "Test de charge sur les routes principales", en: "Load test on main routes"}
