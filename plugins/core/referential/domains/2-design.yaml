group: design
label: {fr: "Design et accessibilité", en: "Design and accessibility"}
domains:

  - id: ui
    code: UI
    label: {fr: "UI", en: "UI"}
    summary: {fr: "Cohérence visuelle, alignements et états interactifs.", en: "Visual consistency, alignment and interactive states."}
    applies_if: [has_ui]
    build:
      - {fr: "Définir les tokens (couleurs, typographie, espacements, rayons, ombres) avant les écrans, et n'utiliser qu'eux.", en: "Define tokens (colours, type, spacing, radius, shadows) before screens, and use only them."}
      - {fr: "Une échelle d'espacement unique (ex. 4 ou 8 px) ; aucun espacement arbitraire.", en: "One spacing scale (e.g. 4 or 8 px); no arbitrary spacing."}
      - {fr: "Chaque élément interactif a ses états : repos, survol, focus visible, actif, désactivé, chargement.", en: "Every interactive element has its states: rest, hover, visible focus, active, disabled, loading."}
      - {fr: "Une seule bibliothèque d'icônes et deux familles de polices au maximum.", en: "One icon library and at most two font families."}
    criteria:
      - id: UI-01
        severity: major
        check: {method: auto, tool: design_token_scan}
        label: {fr: "Couleurs, tailles et espacements passent par les tokens", en: "Colours, sizes and spacing go through tokens"}
        verify: {fr: "Rechercher les valeurs en dur (hex, px arbitraires, classes Tailwind arbitraires) dans les composants.", en: "Search for hard-coded values (hex, arbitrary px, arbitrary Tailwind classes) in components."}
      - id: UI-02
        severity: major
        check: {method: inspect}
        label: {fr: "Tous les éléments interactifs ont survol, focus visible, actif et désactivé", en: "All interactive elements have hover, visible focus, active and disabled"}
        verify: {fr: "Parcourir au clavier et à la souris les boutons, liens, champs.", en: "Go through buttons, links and fields with keyboard and mouse."}
      - id: UI-03
        severity: major
        check: {method: inspect, tool: spacing_audit}
        label: {fr: "Alignements et grille cohérents, aucun élément qui déborde", en: "Consistent alignment and grid, nothing overflowing"}
        verify: {fr: "deslop.json : aucun constat « high » (proximité inversée, écarts inégaux, bords qui dérivent, texte collé, débordement) aux trois largeurs, quelques « med » au plus ; captures : bords gauche et droit égaux, pas de texte coupé.", en: "deslop.json: no high finding (inverted proximity, uneven gaps, drifting edges, cramped text, overflow) at the three widths, a few med at most; screenshots: equal left and right edges, no clipped text."}
      - id: UI-04
        severity: minor
        check: {method: inspect, tool: generic_look_scan}
        label: {fr: "Hiérarchie typographique claire et limitée", en: "Clear and limited type hierarchy"}
        verify: {fr: "Au plus 2 familles de polices et une échelle de tailles définie ; look.json : checks.font_sizes, font_families, line_length et line_height.", en: "At most 2 font families and a defined size scale; look.json: checks.font_sizes, font_families, line_length and line_height."}
      - id: UI-05
        severity: minor
        check: {method: inspect}
        label: {fr: "Composants réutilisés plutôt que dupliqués avec des variations", en: "Components reused rather than duplicated with variations"}
        verify: {fr: "Rechercher les boutons, cartes, modales réimplémentés plusieurs fois.", en: "Search for buttons, cards, modals implemented several times."}
      - id: UI-06
        severity: minor
        check: {method: inspect}
        applies_if: [dark_mode]
        label: {fr: "Le mode sombre est complet et lisible", en: "Dark mode is complete and readable"}
        verify: {fr: "Aucun composant resté clair, contrastes vérifiés dans les deux thèmes.", en: "No component left light, contrast checked in both themes."}

  - id: ai-slop
    code: SLP
    label: {fr: "AI slop", en: "AI slop"}
    summary: {fr: "Suppression du contenu générique, du jargon robotique et des visuels inutiles.", en: "Removal of generic content, robotic jargon and useless visuals."}
    applies_if: [has_ui]
    build:
      - {fr: "Choisir une direction visuelle propre au projet au /kickoff (références, ambiance, contraintes), jamais un style par défaut.", en: "Pick a project-specific visual direction at /kickoff (references, mood, constraints), never a default style."}
      - {fr: "Pas de dégradé violet par défaut, de cartes en verre partout, d'emoji comme icônes, de sections « Pourquoi nous choisir » à trois colonnes génériques.", en: "No default purple gradient, glass cards everywhere, emoji as icons, generic three-column 'Why choose us' sections."}
      - {fr: "Bannir le vocabulaire creux : « révolutionnaire », « sans effort », « libérez votre potentiel », « plongez dans », « au cœur de », « fluide et intuitif ».", en: "Ban hollow wording: 'revolutionary', 'effortless', 'unlock your potential', 'dive into', 'seamless', 'elevate'."}
      - {fr: "Chaque visuel montre le vrai produit, un vrai lieu ou une vraie donnée ; sinon, il est retiré.", en: "Every visual shows the real product, a real place or real data; otherwise it is removed."}
      - {fr: "Les animations servent la compréhension ou le retour d'action, jamais la décoration seule.", en: "Animations serve understanding or feedback, never decoration alone."}
    criteria:
      - id: SLP-01
        severity: major
        check: {method: auto, tool: slop_wording_scan}
        label: {fr: "Aucune formule creuse ou jargon d'IA dans les textes", en: "No hollow phrase or AI jargon in the copy"}
        verify: {fr: "Scanner les textes avec la liste noire FR/EN du pack ; relire les titres et accroches.", en: "Scan the copy with the pack's FR/EN blacklist; reread headings and taglines."}
      - id: SLP-02
        severity: major
        check: {method: inspect}
        label: {fr: "La direction visuelle est propre au projet et documentée", en: "The visual direction is project-specific and documented"}
        verify: {fr: "DESIGN.md décrit les choix (ambiance, couleurs, typographie) et ils se retrouvent à l'écran ; comparer avec les gabarits par défaut (shadcn brut, dégradé violet, verre). L'existence de DESIGN.md ne suffit pas ; le respect de l'organisation des références est vérifié par ERG-08.", en: "DESIGN.md states the choices (mood, colours, type) and they show on screen; compare with default templates (raw shadcn, purple gradient, glass). DESIGN.md existing is not enough; following how the references are organised is checked by ERG-08."}
      - id: SLP-03
        severity: major
        check: {method: inspect}
        label: {fr: "Aucun visuel décoratif sans information (illustrations génériques, blobs, icônes au hasard)", en: "No decorative visual without information (generic illustrations, blobs, random icons)"}
        verify: {fr: "Pour chaque image ou illustration : que montre-t-elle de réel ?", en: "For each image or illustration: what real thing does it show?"}
      - id: SLP-04
        severity: minor
        check: {method: inspect, tool: generic_look_scan}
        label: {fr: "Les sections répondent à une question de l'utilisateur, pas à un gabarit", en: "Sections answer a user question, not a template"}
        verify: {fr: "Chercher les blocs génériques : témoignages inventés, « Nos valeurs », grilles de 3 avantages vagues ; look.json : palier « strong » en mode persuade = échec, « some » = partiel, jamais sur un seul signal ; en mode operate, seuls les signaux de qualité comptent.", en: "Look for generic blocks: invented testimonials, 'Our values', grids of 3 vague benefits; look.json: tier \"strong\" in persuade mode = fail, \"some\" = partial, never on one signal alone; in operate mode only quality signals count."}
      - id: SLP-05
        severity: minor
        check: {method: inspect}
        label: {fr: "Les animations sont utiles, discrètes et respectent prefers-reduced-motion", en: "Animations are useful, subtle and respect prefers-reduced-motion"}
        verify: {fr: "Lister les animations et leur rôle ; tester avec réduction des animations activée.", en: "List animations and their purpose; test with reduced motion enabled."}

  - id: responsive
    code: RSP
    label: {fr: "Responsive", en: "Responsive"}
    summary: {fr: "Adaptation mobile, tablette et PC.", en: "Adaptation to mobile, tablet and desktop."}
    applies_if: [has_ui]
    build:
      - {fr: "Concevoir mobile d'abord, puis élargir ; tester à 360, 390, 768, 1024, 1440 et 1920 px (certaines mises en page ne cassent que sur grand écran).", en: "Design mobile first, then widen; test at 360, 390, 768, 1024, 1440 and 1920 px (some layouts only break on wide screens)."}
      - {fr: "Cibles tactiles d'au moins 44 × 44 px ; aucune fonction accessible uniquement au survol.", en: "Touch targets at least 44 × 44 px; no feature available only on hover."}
      - {fr: "Images servies à la bonne taille (srcset ou composant d'image du framework).", en: "Images served at the right size (srcset or the framework's image component)."}
    criteria:
      - id: RSP-01
        severity: blocker
        check: {method: auto, tool: viewport_screenshots}
        label: {fr: "Aucun défilement horizontal ni contenu coupé de 360 à 1440 px", en: "No horizontal scroll or clipped content from 360 to 1440 px"}
        verify: {fr: "Captures aux 5 largeurs de référence et mesure de scrollWidth, puis à chaque étape des parcours (horizontal_overflow dans flows.json).", en: "Screenshots at the 5 reference widths and scrollWidth check, then at every flow step (horizontal_overflow in flows.json)."}
      - id: RSP-02
        severity: major
        check: {method: inspect}
        label: {fr: "Cibles tactiles d'au moins 44 × 44 px sur mobile", en: "Touch targets at least 44 × 44 px on mobile"}
        verify: {fr: "Mesurer boutons, liens d'icône, cases à cocher en vue mobile.", en: "Measure buttons, icon links, checkboxes in mobile view."}
      - id: RSP-03
        severity: major
        check: {method: inspect}
        label: {fr: "Aucune fonction réservée au survol", en: "No hover-only feature"}
        verify: {fr: "Menus, infobulles et actions accessibles au toucher.", en: "Menus, tooltips and actions reachable by touch."}
      - id: RSP-04
        severity: minor
        check: {method: inspect}
        label: {fr: "Mise en page adaptée à chaque format, pas seulement rétrécie", en: "Layout adapted to each format, not just shrunk"}
        verify: {fr: "Navigation, tableaux et grilles réorganisés sur mobile et tablette.", en: "Navigation, tables and grids reorganised on mobile and tablet."}
      - id: RSP-05
        severity: minor
        check: {method: inspect}
        label: {fr: "Zones sûres et clavier virtuel gérés sur mobile", en: "Safe areas and on-screen keyboard handled on mobile"}
        verify: {fr: "Encoche, barre du bas iOS et champ masqué par le clavier testés.", en: "Notch, iOS bottom bar and field hidden by keyboard tested."}

  - id: accessibility
    code: A11Y
    label: {fr: "Accessibilité", en: "Accessibility"}
    summary: {fr: "Contrastes, navigation clavier et lecteurs d'écran (cible WCAG 2.2 AA).", en: "Contrast, keyboard navigation and screen readers (target WCAG 2.2 AA)."}
    applies_if: [has_ui]
    build:
      - {fr: "HTML sémantique d'abord : button pour une action, a pour un lien, un seul h1, titres dans l'ordre.", en: "Semantic HTML first: button for actions, a for links, one h1, headings in order."}
      - {fr: "Contraste d'au moins 4,5:1 pour le texte et 3:1 pour les composants et grands textes.", en: "Contrast at least 4.5:1 for text and 3:1 for components and large text."}
      - {fr: "Tout fonctionne au clavier, avec un focus toujours visible et un ordre logique.", en: "Everything works by keyboard, with always-visible focus and a logical order."}
      - {fr: "Chaque champ a un label visible ; chaque image utile a un alt ; chaque bouton icône a un nom accessible.", en: "Every field has a visible label; every meaningful image has alt text; every icon button has an accessible name."}
      - {fr: "L'information ne passe jamais par la couleur seule.", en: "Information never relies on colour alone."}
    criteria:
      - id: A11Y-01
        severity: blocker
        check: {method: auto, tool: axe}
        label: {fr: "Aucune violation axe-core critique ou sérieuse sur les pages principales et les états des parcours", en: "No critical or serious axe-core violation on main pages and flow states"}
        verify: {fr: "axe-core (via Playwright) sur chaque page principale et à chaque étape des tâches clés (flows.json). Un écran vide sans violation ne suffit pas à réussir.", en: "axe-core (via Playwright) on each main page and at every step of the key tasks (flows.json). An empty screen with no violation is not enough to pass."}
      - id: A11Y-02
        severity: major
        check: {method: inspect}
        label: {fr: "Parcours principaux réalisables entièrement au clavier, focus visible", en: "Main flows fully doable by keyboard, visible focus"}
        verify: {fr: "Tab, Maj+Tab, Entrée, Espace, Échap sur chaque tâche clé, dans l'état rempli (données de test chargées) ; modales qui piègent et rendent le focus.", en: "Tab, Shift+Tab, Enter, Space, Esc on each key task, in the filled state (test data loaded); modals trap and restore focus."}
      - id: A11Y-03
        severity: major
        check: {method: auto, tool: contrast_check}
        label: {fr: "Contrastes conformes (4,5:1 texte, 3:1 composants)", en: "Compliant contrast (4.5:1 text, 3:1 components)"}
        verify: {fr: "Mesure sur les tokens de couleur et les pages rendues, dans chaque thème.", en: "Measure on colour tokens and rendered pages, in every theme."}
      - id: A11Y-04
        severity: major
        check: {method: inspect}
        label: {fr: "Labels, alternatives textuelles et noms accessibles présents", en: "Labels, text alternatives and accessible names present"}
        verify: {fr: "Champs sans label, images sans alt, boutons icône sans aria-label.", en: "Fields without labels, images without alt, icon buttons without aria-label."}
      - id: A11Y-05
        severity: minor
        check: {method: inspect}
        label: {fr: "Structure lisible par lecteur d'écran (titres, régions, annonces)", en: "Structure readable by screen reader (headings, landmarks, announcements)"}
        verify: {fr: "Test VoiceOver ou NVDA ; erreurs et notifications annoncées (aria-live).", en: "VoiceOver or NVDA test; errors and notifications announced (aria-live)."}
      - id: A11Y-06
        severity: minor
        check: {method: inspect}
        label: {fr: "Zoom à 200 % sans perte de contenu, langue de la page déclarée", en: "200% zoom without loss of content, page language declared"}
        verify: {fr: "Zoom navigateur à 200 % ; attribut lang sur html.", en: "Browser zoom at 200%; lang attribute on html."}

  - id: compatibility
    code: CMP
    label: {fr: "Compatibilité", en: "Compatibility"}
    summary: {fr: "Navigateurs et appareils.", en: "Browsers and devices."}
    applies_if: [has_ui]
    build:
      - {fr: "Déclarer les navigateurs cibles (browserslist) et s'y tenir pour le CSS et le JavaScript.", en: "Declare target browsers (browserslist) and stick to them for CSS and JavaScript."}
      - {fr: "Vérifier la compatibilité d'une API récente avant de l'utiliser, avec repli si besoin.", en: "Check support for a recent API before using it, with a fallback if needed."}
      - {fr: "Tester Safari iOS en plus de Chrome : c'est là que la plupart des bugs mobiles apparaissent.", en: "Test iOS Safari as well as Chrome: most mobile bugs show up there."}
    criteria:
      - id: CMP-01
        severity: major
        check: {method: auto, tool: e2e_cross_browser}
        label: {fr: "Parcours principaux testés sur Chromium, Firefox et WebKit", en: "Main flows tested on Chromium, Firefox and WebKit"}
        verify: {fr: "Tests Playwright sur les trois moteurs.", en: "Playwright tests on all three engines."}
      - id: CMP-02
        severity: major
        check: {method: inspect}
        label: {fr: "Navigateurs cibles déclarés et respectés", en: "Target browsers declared and respected"}
        verify: {fr: "browserslist présent ; pas d'API non supportée sans repli.", en: "browserslist present; no unsupported API without fallback."}
      - id: CMP-03
        severity: minor
        check: {method: manual}
        label: {fr: "Test sur au moins un vrai iPhone et un vrai Android", en: "Tested on at least one real iPhone and one real Android device"}
        verify: {fr: "Parcours principal fait à la main sur appareil réel.", en: "Main flow run by hand on a real device."}
      - id: CMP-04
        severity: minor
        check: {method: inspect}
        label: {fr: "Fonctionne sans extension et avec bloqueur de publicité", en: "Works without extensions and with an ad blocker"}
        verify: {fr: "Les scripts tiers bloqués ne cassent pas l'application.", en: "Blocked third-party scripts do not break the app."}

  - id: craft
    code: CRF
    label: {fr: "Finitions", en: "Craft"}
    summary: {fr: "Les détails qui séparent un produit soigné d'un premier jet : typographie, états, mouvement, images, attente, pages annexes.", en: "The details that separate a cared-for product from a first draft: typography, states, motion, images, waiting, side pages."}
    applies_if: [has_ui]
    build:
      - {fr: "Typographie : text-wrap: balance sur les titres, chiffres tabulaires dans les colonnes et compteurs, vrais caractères (’ « » … et espaces insécables), capitales espacées, 4 graisses au plus.", en: "Typography: text-wrap: balance on headings, tabular figures in columns and counters, real characters (’ “ ” … and non-breaking spaces), tracked capitals, 4 weights at most."}
      - {fr: "Ombres douces en deux couches ou plus, d'une seule direction de lumière, teintées par le fond ; une échelle d'élévation, pas une ombre par composant.", en: "Soft shadows in two layers or more, one light direction, tinted by the background; an elevation scale, not one shadow per component."}
      - {fr: "Rayons concentriques : rayon intérieur = rayon extérieur − marge intérieure.", en: "Concentric radii: inner radius = outer radius − padding."}
      - {fr: "Chaque contrôle a ses états : survol, focus clavier visible, appui, désactivé, chargement. Le survol et le focus contrastent plus que le repos.", en: "Every control has its states: hover, visible keyboard focus, pressed, disabled, loading. Hover and focus contrast more than rest."}
      - {fr: "Mouvement : 100 à 300 ms sur l'interface, sortie en ease-out, seulement transform et opacity, jamais transition: all ; aucune animation sur une action au clavier ou très fréquente.", en: "Motion: 100 to 300 ms on the interface, ease-out, transform and opacity only, never transition: all; no animation on a keyboard or very frequent action."}
      - {fr: "Attente : rien sous 1 seconde ; indicateur retardé de 150 à 300 ms puis gardé au moins 300 ms ; squelette fidèle à la mise en page pour une page ; barre de progression au-delà de 10 secondes.", en: "Waiting: nothing under 1 second; indicator delayed by 150 to 300 ms then kept at least 300 ms; skeleton matching the layout for a page; progress bar beyond 10 seconds."}
      - {fr: "Mise à jour optimiste quand le succès est probable, avec retour arrière ; annuler plutôt que confirmer pour ce qui est réversible.", en: "Optimistic update when success is likely, with rollback; undo rather than confirm for what is reversible."}
      - {fr: "Thème sombre : un modèle d'élévation à part (les surfaces s'éclaircissent en montant), color-scheme: dark déclaré, jamais une simple inversion.", en: "Dark theme: its own elevation model (surfaces get lighter as they rise), color-scheme: dark declared, never a plain inversion."}
      - {fr: "État dans l'adresse (filtres, onglets, page, panneau ouvert) : partager, recharger et revenir en arrière fonctionnent.", en: "State in the address (filters, tabs, page, open panel): sharing, reloading and going back work."}
      - {fr: "Soigner ce qui entoure la page : icône du site, image de partage, page 404 et page d'erreur dans la voix du produit, titre d'onglet qui suit le contexte.", en: "Care for what surrounds the page: site icon, share image, 404 and error pages in the product's voice, tab title that follows the context."}
    criteria:
      - id: CRF-01
        severity: blocker
        check: {method: auto, tool: craft_scan}
        label: {fr: "Aucun défaut de finition visible ou gênant sur les écrans clés", en: "No visible or obstructive finish defect on the key screens"}
        verify: {fr: "craft.json sur les pages principales et les écrans de travail : aucun « must » en échec (focus clavier, images déformées ou floues, champs sous 16 px sur téléphone, zoom bloqué, saut de mise en page, chiffres non alignés, icône du site, statut 404).", en: "craft.json on the main pages and work screens: no failed \"must\" (keyboard focus, stretched or blurry images, fields under 16 px on phone, blocked zoom, layout shift, unaligned figures, site icon, 404 status)."}
      - id: CRF-02
        severity: major
        check: {method: auto, tool: craft_scan}
        label: {fr: "Finitions typographiques, de surface et de mouvement tenues", en: "Typographic, surface and motion finish kept"}
        verify: {fr: "craft.json : chaque « should » en échec est corrigé ou justifié par un choix écrit dans DESIGN.md (titres équilibrés, caractères typographiques, ombres, rayons imbriqués, survol, durées, icônes).", en: "craft.json: each failed \"should\" is fixed or justified by a choice written in DESIGN.md (balanced headings, typographic characters, shadows, nested radii, hover, durations, icons)."}
      - id: CRF-03
        severity: major
        check: {method: inspect}
        label: {fr: "Chaque contrôle a tous ses états", en: "Every control has all its states"}
        verify: {fr: "Boutons, champs, liens, onglets des écrans clés : survol, focus, appui, désactivé et chargement existent et se distinguent ; le bouton en chargement garde son libellé.", en: "Buttons, fields, links, tabs of the key screens: hover, focus, pressed, disabled and loading exist and differ; a loading button keeps its label."}
      - id: CRF-04
        severity: major
        check: {method: inspect}
        label: {fr: "Attente traitée selon sa durée", en: "Waiting handled according to its length"}
        verify: {fr: "Réseau ralenti sur une tâche clé : pas d'indicateur qui clignote sous 300 ms, squelette fidèle pour les pages, progression au-delà de 10 secondes, aucune page blanche.", en: "Throttled network on a key task: no indicator flashing under 300 ms, faithful skeleton for pages, progress beyond 10 seconds, no blank page."}
      - id: CRF-05
        severity: major
        check: {method: inspect}
        label: {fr: "Annulation possible pour ce qui est réversible, confirmation pour le reste", en: "Undo for what is reversible, confirmation for the rest"}
        verify: {fr: "Supprimer, archiver, déplacer : annulation proposée au moins 5 secondes. Action irréversible : confirmation qui nomme ce qui sera perdu.", en: "Delete, archive, move: undo offered for at least 5 seconds. Irreversible action: confirmation naming what will be lost."}
      - id: CRF-06
        severity: major
        check: {method: inspect}
        label: {fr: "L'adresse reflète l'état de l'écran", en: "The address reflects the screen's state"}
        verify: {fr: "Appliquer un filtre, changer d'onglet ou de page, puis recharger et revenir en arrière : même état, même position de défilement.", en: "Apply a filter, change tab or page, then reload and go back: same state, same scroll position."}
      - id: CRF-07
        severity: major
        check: {method: inspect}
        applies_if: [dark_mode]
        label: {fr: "Thème sombre construit, pas inversé", en: "Dark theme built, not inverted"}
        verify: {fr: "Les surfaces s'éclaircissent avec l'élévation ; bordures fines en blanc à faible opacité ; aucune ombre noire sur fond noir ; contrôles natifs et barres de défilement sombres.", en: "Surfaces get lighter with elevation; hairlines in low-opacity white; no black shadow on a black background; native controls and scrollbars dark."}
      - id: CRF-08
        severity: minor
        check: {method: inspect}
        label: {fr: "Clavier d'abord sur les écrans de travail", en: "Keyboard first on work screens"}
        verify: {fr: "Entrée envoie le formulaire ; Échap ferme ; les listes se parcourent aux flèches ; les raccourcis sont affichés ; une application à plusieurs écrans a une recherche ou une palette de commandes.", en: "Enter submits the form; Escape closes; lists move with arrow keys; shortcuts are shown; a multi-screen app has a search or a command palette."}
      - id: CRF-09
        severity: minor
        check: {method: inspect}
        label: {fr: "Emails et pages d'erreur à l'image du produit", en: "Emails and error pages look like the product"}
        verify: {fr: "Pages 404 et 500, emails de service : même voix, mêmes couleurs et typographie que l'application, et une action pour continuer.", en: "404 and 500 pages, service emails: same voice, colours and typography as the app, and an action to continue."}

  - id: brand
    code: BRD
    label: {fr: "Identité et contenu vrai", en: "Identity and true content"}
    summary: {fr: "Une identité propre au produit, des contenus réels et vérifiables, des ressources sous licence.", en: "An identity of the product's own, real and checkable content, licensed resources."}
    applies_if: [has_ui]
    build:
      - {fr: "Tirer la couleur, la typographie et les images du sujet du produit et de son public, pas de la mode de la catégorie.", en: "Draw colour, type and imagery from the product's subject and audience, not from the category's fashion."}
      - {fr: "Éviter les trois palettes réflexes : violet-indigo, crème et terracotta, presque noir et vert acide.", en: "Avoid the three reflex palettes: purple-indigo, cream and terracotta, near-black and acid green."}
      - {fr: "Deux familles de caractères au plus, plus une à chasse fixe si besoin ; pas Inter ou Geist comme seule police ; noter nom, fonderie, licence et source de chaque police.", en: "Two typefaces at most, plus a monospace if needed; not Inter or Geist as the only face; record name, foundry, licence and source of each font."}
      - {fr: "Un seul jeu d'icônes, une seule épaisseur de trait réglée selon la taille ; dessiner les quelques icônes des objets propres au produit ; jamais un glyphe du jeu d'icônes comme logo.", en: "One icon set, one stroke width tuned to the size; draw the few icons of the product's own objects; never a glyph of the icon set as the logo."}
      - {fr: "Images, par ordre de préférence : le vrai produit (captures, composants), des schémas faits pour la page, ses propres photos, des images d'archives traitées de façon cohérente, rien. Pas d'illustrations de kit ni d'image générée contenant du texte, une interface ou des personnes.", en: "Imagery, in order of preference: the real product (screenshots, components), diagrams made for the page, own photos, archive images with a consistent treatment, nothing. No kit illustrations and no generated image containing text, an interface or people."}
      - {fr: "Tout chiffre, citation, logo de client ou badge affiché vient d'un fait fourni par l'utilisateur ; sinon le bloc n'existe pas.", en: "Every number, quote, customer logo or badge shown comes from a fact supplied by the user; otherwise the block does not exist."}
      - {fr: "Textes : dire ce que le produit fait et pour qui, avec les mots des clients ; libellé de bouton = verbe + objet ; erreur = ce qui s'est passé + comment corriger.", en: "Copy: say what the product does and for whom, in customers' words; button label = verb + object; error = what happened + how to fix it."}
    criteria:
      - id: BRD-01
        severity: blocker
        check: {method: inspect}
        label: {fr: "Aucun témoignage, chiffre, logo de client ou badge inventé", en: "No invented testimonial, figure, customer logo or badge"}
        verify: {fr: "Chaque citation, nombre (« 10 000 équipes », « 99,9 % »), logo et badge des pages publiques est relié à une source fournie par l'utilisateur (fichier de faits, lien). Sans source : échec.", en: "Every quote, number (\"10,000 teams\", \"99.9%\"), logo and badge on public pages traces to a source supplied by the user (facts file, link). No source: fail."}
      - id: BRD-02
        severity: major
        check: {method: inspect}
        label: {fr: "Direction visuelle tirée du produit, écrite et suivie", en: "Visual direction drawn from the product, written and followed"}
        verify: {fr: "DESIGN.md dit d'où viennent la couleur, la typographie et les images, et ce que le produit refuse ; les écrans s'y conforment ; pas de palette réflexe non justifiée.", en: "DESIGN.md says where colour, type and imagery come from, and what the product refuses; the screens comply; no unjustified reflex palette."}
      - id: BRD-03
        severity: major
        check: {method: inspect}
        label: {fr: "Typographie choisie et sous licence notée", en: "Typeface chosen, licence recorded"}
        verify: {fr: "Deux familles au plus (plus une à chasse fixe) ; la police de texte a de vraies italiques et des chiffres tabulaires ; nom, fonderie, licence et source notés ; polices hébergées par le projet.", en: "Two families at most (plus a monospace); the text face has real italics and tabular figures; name, foundry, licence and source recorded; fonts hosted by the project."}
      - id: BRD-04
        severity: major
        check: {method: inspect}
        label: {fr: "Un seul jeu d'icônes, ajusté, et un logo qui n'en vient pas", en: "One icon set, adjusted, and a logo that does not come from it"}
        verify: {fr: "Un seul jeu, une épaisseur de trait par taille ; les objets propres au produit ont leur icône ; le logo n'est pas un glyphe du jeu ; l'icône du site, l'image de partage et l'avatar dérivent du même dessin.", en: "One set, one stroke width per size; the product's own objects have their icon; the logo is not a glyph of the set; site icon, share image and avatar derive from the same drawing."}
      - id: BRD-05
        severity: major
        check: {method: inspect}
        label: {fr: "Images réelles et cohérentes", en: "Real and consistent imagery"}
        verify: {fr: "Les pages montrent le vrai produit ; pas d'illustration de kit, pas d'image générée avec du texte, une interface ou des personnes ; un même traitement pour toutes ; source et licence notées.", en: "Pages show the real product; no kit illustration, no generated image with text, an interface or people; one treatment for all; source and licence recorded."}
      - id: BRD-06
        severity: major
        check: {method: inspect}
        label: {fr: "Textes précis, dans une voix tenue", en: "Specific copy, in a consistent voice"}
        verify: {fr: "Le titre principal dit ce que fait le produit et pour qui ; boutons en verbe + objet ; erreurs avec leur solution ; même mot pour la même chose partout ; pas de suite de trois blocs de longueur identique sans raison.", en: "The main headline says what the product does and for whom; buttons as verb + object; errors with their fix; the same word for the same thing everywhere; no run of three blocks of identical length without a reason."}
