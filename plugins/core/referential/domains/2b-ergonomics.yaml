group: ergonomics
label: {fr: "Ergonomie", en: "Ergonomics"}
domains:

  - id: ergonomics
    code: ERG
    label: {fr: "Ergonomie et architecture de l'information", en: "Ergonomics and information architecture"}
    summary: {fr: "Organisation des écrans et effort demandé pour chaque tâche clé, mesurés en jouant les tâches sur téléphone et sur ordinateur, pas seulement l'hygiène de chaque écran.", en: "How screens are organised and how much effort each key task takes, measured by playing the tasks on a phone and on a desktop, not only the hygiene of each screen."}
    applies_if: [has_ui]
    build:
      - {fr: "Lister 2 à 5 tâches clés au /sw:kickoff (project.json › flows), avec leurs données de test, et concevoir les écrans à partir d'elles.", en: "List 2 to 5 key tasks at /sw:kickoff (project.json › flows), with their test data, and design the screens from them."}
      - {fr: "Au-delà d'une douzaine de réglages, les ranger en onglets, en étapes ou en sections repliables ; une page de réglages qu'on fait défiler sans fin n'est jamais une solution.", en: "Past a dozen settings, group them in tabs, steps or collapsible sections; an endlessly scrolling settings page is never the answer."}
      - {fr: "Le résultat (aperçu, total, rendu) reste visible pendant qu'on règle ; sur téléphone, aperçu en haut et panneau de réglages en bas.", en: "The result (preview, total, rendering) stays visible while adjusting; on a phone, preview on top and settings panel below."}
      - {fr: "L'action principale est atteignable sans défiler, et sous le pouce sur téléphone (barre d'action en bas).", en: "The main action is reachable without scrolling, and under the thumb on a phone (bottom action bar)."}
      - {fr: "Les réglages suivent l'ordre de la tâche, une décision à la fois, avec une option conseillée déjà choisie ; les réglages avancés sont à part.", en: "Settings follow the order of the task, one decision at a time, with a recommended option already selected; advanced settings are set apart."}
      - {fr: "Un thème, un modèle ou une valeur par défaut n'écrase jamais un choix de l'utilisateur sans le dire et sans permettre d'annuler.", en: "A theme, template or default never overwrites a user's choice without saying so and offering undo."}
      - {fr: "Concevoir le téléphone et l'ordinateur séparément : chacun a sa propre organisation, pas la même page étirée ou rétrécie.", en: "Design the phone and the desktop separately: each gets its own layout, not the same page stretched or shrunk."}
      - {fr: "Reprendre des références nommées dans DESIGN.md leur organisation (structure d'écran, navigation, gestes), pas seulement leurs couleurs.", en: "Take from the references named in DESIGN.md their organisation (screen structure, navigation, gestures), not only their colours."}
    criteria:
      - id: ERG-01
        severity: major
        check: {method: auto, tool: flow_run}
        label: {fr: "Les tâches clés sont déclarées et se jouent jusqu'au bout sur téléphone et sur ordinateur", en: "Key tasks are declared and play to the end on a phone and on a desktop"}
        verify: {fr: "2 à 5 parcours dans project.json › flows, avec données de test ; flows.json : chaque exécution « completed » sur les deux appareils. Sans parcours : échec.", en: "2 to 5 flows in project.json › flows, with test data; flows.json: every run completed on both devices. No flows: fail."}
      - id: ERG-02
        severity: major
        check: {method: auto, tool: flow_run}
        label: {fr: "Chaque tâche tient dans le budget d'effort : pages à faire défiler, écrans parcourus, actions", en: "Each task stays within the effort budget: pages to scroll, screens scrolled through, actions"}
        verify: {fr: "flows.json : over_budget vide pour chaque exécution, sur téléphone et sur ordinateur (budgets dans scoring.yaml › flow_budgets ou dans le parcours). Un seul appareil dans le budget : partiel.", en: "flows.json: over_budget empty for every run, on phone and desktop (budgets in scoring.yaml › flow_budgets or in the flow). Only one device within budget: partial."}
      - id: ERG-03
        severity: major
        check: {method: auto, tool: flow_run}
        label: {fr: "Peu de réglages visibles à la fois ; au-delà, onglets, étapes ou sections repliables", en: "Few settings shown at once; beyond that, tabs, steps or collapsible sections"}
        verify: {fr: "flows.json : max_controls_rendered sous le budget à chaque étape ; s'il est dépassé, uses_disclosure doit être vrai et la capture montrer un seul groupe ouvert à la fois.", en: "flows.json: max_controls_rendered under budget at every step; if over, uses_disclosure must be true and the screenshot must show one group open at a time."}
      - id: ERG-04
        severity: major
        check: {method: auto, tool: flow_run}
        label: {fr: "Le résultat reste visible pendant qu'on règle", en: "The result stays visible while adjusting"}
        verify: {fr: "Parcours qui déclarent preview : preview_visible_while_adjusting d'au moins 0,8 sur les deux appareils. Sans résultat à montrer dans le produit : sans objet, en le justifiant.", en: "Flows that declare preview: preview_visible_while_adjusting of at least 0.8 on both devices. No result to show in the product: n/a, with the reason."}
      - id: ERG-05
        severity: major
        check: {method: auto, tool: flow_run}
        label: {fr: "L'action principale est atteignable sans défiler, sous le pouce sur téléphone", en: "The main action is reachable without scrolling, under the thumb on a phone"}
        verify: {fr: "Parcours qui déclarent primary : primary_visible vrai sur les deux appareils et primary_in_thumb_zone vrai sur téléphone.", en: "Flows that declare primary: primary_visible true on both devices and primary_in_thumb_zone true on phone."}
      - id: ERG-06
        severity: major
        check: {method: inspect}
        label: {fr: "Un choix de l'utilisateur n'est jamais écrasé sans le dire (thème, modèle, valeur par défaut)", en: "A user's choice is never overwritten silently (theme, template, default value)"}
        verify: {fr: "Lire le code qui applique un thème, un modèle ou un préréglage ; dans un parcours, faire un choix puis appliquer le thème : le choix reste, ou un message propose d'annuler.", en: "Read the code that applies a theme, template or preset; in a flow, make a choice then apply the theme: the choice stays, or a message offers undo."}
      - id: ERG-07
        severity: major
        check: {method: inspect}
        label: {fr: "Les réglages suivent l'ordre de la tâche, une décision à la fois, avec une option conseillée", en: "Settings follow the order of the task, one decision at a time, with a recommended option"}
        verify: {fr: "Sur les captures des parcours : ce que l'utilisateur décide en premier vient en premier, une option conseillée est déjà choisie (ou « choisir pour moi »), les réglages avancés sont à part.", en: "On the flow screenshots: what the user decides first comes first, a recommended option is preselected (or \"choose for me\"), advanced settings are set apart."}
      - id: ERG-08
        severity: major
        check: {method: inspect}
        label: {fr: "L'appli reprend l'organisation des références de DESIGN.md, pas seulement leur palette", en: "The app follows how the DESIGN.md references are organised, not only their palette"}
        verify: {fr: "Pour chaque référence de DESIGN.md › « Ce qu'on leur emprunte » : le principe (aperçu + barre d'outils, panneaux par onglet, étapes…) se voit sur les captures, sur téléphone et sur ordinateur. Pas de liste d'emprunts : échec.", en: "For each reference in DESIGN.md › \"What we borrow\": the principle (preview + toolbar, tabbed panels, steps…) shows on the screenshots, on phone and desktop. No borrow list: fail."}
      - id: ERG-09
        severity: major
        check: {method: inspect}
        label: {fr: "Revue heuristique des tâches clés : aucun problème critique, aucun majeur ouvert", en: "Heuristic review of the key tasks: no critical problem, no open major one"}
        verify: {fr: "Revue par l'agent ergonome (heuristiques de Nielsen, critères de Bastien et Scapin) sur les captures de chaque étape, téléphone et ordinateur séparément. Un critique : échec ; un majeur : partiel.", en: "Review by the ergonomist agent (Nielsen's heuristics, Bastien and Scapin's criteria) on the screenshot of every step, phone and desktop separately. One critical: fail; one major: partial."}
